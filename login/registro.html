<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Caribbean Cinemas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .register-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #333;
            font-size: 2.2em;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 5px;
        }

        .logo .cinema-text {
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: #666;
            font-size: 0.9em;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 1);
        }

        .form-group input::placeholder {
            color: #999;
            font-weight: 400;
        }

        .password-input-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 1.1em;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .toggle-password:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 30px 0 25px;
            position: relative;
            color: #666;
            font-size: 0.9em;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ddd, transparent);
        }

        .divider span {
            background: rgba(255, 255, 255, 0.95);
            padding: 0 20px;
            position: relative;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95em;
            position: relative;
            transition: all 0.3s ease;
        }

        .login-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .login-link a:hover::after {
            width: 100%;
        }

        .login-link a:hover {
            color: #764ba2;
        }

        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .terms-checkbox input[type="checkbox"] {
            width: auto !important;
            margin: 0;
            accent-color: #667eea;
        }

        .terms-checkbox label {
            margin: 0;
            color: #555;
            font-weight: 400;
            cursor: pointer;
        }

        .terms-checkbox a {
            color: #667eea;
            text-decoration: none;
        }

        .terms-checkbox a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(255, 82, 82, 0.1);
            color: #ff5252;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9em;
            margin-bottom: 20px;
            border-left: 4px solid #ff5252;
            display: none;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9em;
            margin-bottom: 20px;
            border-left: 4px solid #4caf50;
            display: none;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 30px 25px;
                margin: 10px;
            }

            .logo h1 {
                font-size: 1.8em;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="register-container">
        <div class="logo">
            <h1>Caribbean <span class="cinema-text">Cinemas</span></h1>
            <p>Únete a la experiencia cinematográfica</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <div class="password-input-container">
                    <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña segura" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('contrasena')">
                        👁️
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmarContrasena">Confirmar Contraseña</label>
                <div class="password-input-container">
                    <input type="password" id="confirmarContrasena" name="confirmarContrasena" placeholder="Confirma tu contraseña" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmarContrasena')">
                        👁️
                    </button>
                </div>
            </div>

            <div class="terms-checkbox">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">
                    Acepto los <a href="#" onclick="showTerms()">términos y condiciones</a> y la <a href="#" onclick="showPrivacy()">política de privacidad</a> de Caribbean Cinemas
                </label>
            </div>

            <button type="submit" class="register-btn" id="registerBtn">
                Crear Cuenta
            </button>
        </form>

        <div class="divider">
            <span>¿Ya tienes cuenta?</span>
        </div>

        <div class="login-link">
            <a href="login.html" onclick="goToLogin()">Inicia sesión aquí</a>
        </div>
    </div>

    <script>
        // Datos del formulario (simulando el envío al backend)
        const userData = {
            rol: 'CLIENTE' // Por defecto como especificaste
        };

        // Función para mostrar/ocultar contraseñas
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;

            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '🙈';
            } else {
                input.type = 'password';
                button.textContent = '👁️';
            }
        }

        // Validación de contraseñas
        function validatePasswords() {
            const password = document.getElementById('contrasena').value;
            const confirmPassword = document.getElementById('confirmarContrasena').value;

            if (password !== confirmPassword) {
                showError('Las contraseñas no coinciden');
                return false;
            }

            if (password.length < 6) {
                showError('La contraseña debe tener al menos 6 caracteres');
                return false;
            }

            return true;
        }

        // Función para mostrar errores
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';

            // Ocultar después de 5 segundos
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Función para mostrar éxito
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';

            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        // Manejo del formulario
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Ocultar mensajes anteriores
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';

            // Validar contraseñas
            if (!validatePasswords()) {
                return;
            }

            // Recoger datos del formulario
            const formData = new FormData(this);
            const registerData = {
                nombre: formData.get('nombre'),
                correo: formData.get('correo'),
                contrasena: formData.get('contrasena'),
                rol: userData.rol
            };

            // Mostrar loading
            const submitBtn = document.getElementById('registerBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="loading"></span>Creando cuenta...';
            submitBtn.disabled = true;

            try {
                // Llamada al backend PHP
                const result = await registerUser(registerData);

                showSuccess('¡Cuenta creada exitosamente! Redirigiendo...');

                // Limpiar formulario
                document.getElementById('registerForm').reset();

                // Simular redirección después de 2 segundos
                setTimeout(() => {
                    console.log('Redirigir al login o dashboard');
                    location.href='login.html'; // Descomenta para redirigir
                }, 2000);

            } catch (error) {
                showError(error.message || 'Error al crear la cuenta. Intenta nuevamente.');
            } finally {
                // Restaurar botón
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        // Función para registrar usuario (llamada real al backend)
        async function registerUser(data) {
            try {
                console.log('Enviando datos:', data); // Debug
                
                // CAMBIAR ESTA RUTA POR LA CORRECTA A TU ARCHIVO PHP
                const response = await fetch('registro.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Accept': 'application/json'
                    },
                    body: new URLSearchParams(data)
                });

                console.log('Respuesta status:', response.status); // Debug
                console.log('Respuesta headers:', response.headers.get('content-type')); // Debug

                // Verificar si la respuesta es exitosa
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const responseText = await response.text();
                console.log('Respuesta raw:', responseText); // Debug
                
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('Error parsing JSON:', parseError);
                    throw new Error('Error en la respuesta del servidor: ' + responseText.substring(0, 200));
                }
                
                if (!result.success) {
                    throw new Error(result.message);
                }
                
                return result;
                
            } catch (error) {
                console.error('Error completo:', error); // Debug
                // Manejar diferentes tipos de errores
                if (error instanceof TypeError) {
                    throw new Error('Error de conexión. Verifica tu conexión a internet.');
                } else {
                    throw error;
                }
            }
        }

        // Funciones de navegación (implementar según tu estructura)
        function goToLogin() {
            console.log('Redirigir a login');
            window.location.href = 'C:\wamp64\www\Proyecto_Cine\login\login.html';
        }

        function showTerms() {
            alert('Aquí mostrarías los términos y condiciones completos');
        }

        function showPrivacy() {
            alert('Aquí mostrarías la política de privacidad');
        }

        // Validación en tiempo real del correo
        document.getElementById('correo').addEventListener('blur', function() {
            const email = this.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email && !emailRegex.test(email)) {
                showError('Por favor ingresa un correo válido');
                this.focus();
            }
        });

        // Validación en tiempo real de confirmación de contraseña
        document.getElementById('confirmarContrasena').addEventListener('input', function() {
            const password = document.getElementById('contrasena').value;
            const confirmPassword = this.value;

            if (confirmPassword && password !== confirmPassword) {
                this.setCustomValidity('Las contraseñas no coinciden');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
</body>

</html>
